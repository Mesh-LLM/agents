[package]
name = "mesh-agents-a2a"
version.workspace = true
edition = "2021"

[lints]
workspace = true

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "0.1.17" }
a2a-server = { package = "a2a-server-lf", version = "0.3.1", default-features = false }
anyhow.workspace = true
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = "0.5"
