[package]
name = "mesh-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mesh-native A2A agents plugin and MCP bridge for mesh-llm"
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "agents"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
http-body-util = "0.1"
mesh-agents-a2a = { path = "../mesh-agents-a2a" }
mesh-agents-acp-bridge = { path = "../mesh-agents-acp-bridge" }
mesh-agents-skills = { path = "../mesh-agents-skills" }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "a9a9928bb02f4e72b149b369ff9b215e4d5cb55b" }
rmcp = { version = "1.2", features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
toml = "0.8"
tower = "0.5"
